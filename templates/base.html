<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body{
display:flex;
background:#f4f6f9;
}

/* Sidebar */

.sidebar{
width:220px;
height:100vh;
background:#2c3e50;
color:white;
position:fixed;
}

.sidebar h2{
text-align:center;
padding:20px;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.sidebar ul{
list-style:none;
padding:20px 0;
}

.sidebar ul li{
padding:15px 20px;
}

.sidebar ul li a{
color:white;
text-decoration:none;
display:block;
}

.sidebar ul li:hover{
background:#34495e;
}

/* Main content */

.main{
margin-left:220px;
width:100%;
}

/* Top Navbar */

.navbar{
background:white;
padding:15px 20px;
border-bottom:1px solid #ddd;
display:flex;
justify-content:space-between;
align-items:center;
}

.navbar h3{
color:#333;
}

/* Page container */

.container{
padding:25px;
}

/* Table */

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#3498db;
color:white;
}

tr:hover{
background:#f1f1f1;
}

/* Buttons */

.btn{
padding:8px 14px;
background:#3498db;
color:white;
text-decoration:none;
border-radius:4px;
border:none;
cursor:pointer;
}

.btn:hover{
background:#2980b9;
}

.btn-danger{
background:#e74c3c;
}

.btn-danger:hover{
background:#c0392b;
}

/* Forms */

input{
padding:8px;
width:250px;
margin-top:5px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:4px;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h2>Admin Panel</h2>

<ul>

<li>
<a href="/dashboard">Dashboard</a>
</li>

<li>
<a href="/new_entry">New Entry</a>
</li>

<li>
<a href="/logs">Logs</a>
</li>

<li>
<a href="/logout">Logout</a>
</li>

</ul>

</div>

<!-- Main Content -->

<div class="main">

<div class="navbar">
<h3>Website Admin Dashboard</h3>
</div>

<div class="container">

{% block content %}
{% endblock %}

</div>

</div>

</body>

</html>
