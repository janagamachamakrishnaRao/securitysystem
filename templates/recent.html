<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f6f9;font-family:Arial;}
.stat{padding:15px;color:white;border-radius:10px;text-align:center;}
.blue{background:#3498db;}
.green{background:#2ecc71;}
.orange{background:#f39c12;}
.red{background:#e74c3c;}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-2">
<div class="container-fluid d-flex justify-content-between">
<span class="navbar-brand">Pennar Security</span>

<div class="d-flex flex-wrap">
<a href="/entry" class="btn btn-outline-light btn-sm">Entry</a>
<a href="/logs" class="btn btn-outline-light btn-sm">Logs</a>
<a href="/inside" class="btn btn-outline-light btn-sm">Inside</a>
<a href="/dashboard" class="btn btn-outline-light btn-sm">Dash</a>
<a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</div>
</div>
</nav>

<div class="container-fluid px-3 mt-3">

<h3>Dashboard</h3>

<div class="row">

<div class="col-6 mb-2"><div class="stat blue">Total<br>{{ total_count }}</div></div>
<div class="col-6 mb-2"><div class="stat orange">Inside<br>{{ inside_count }}</div></div>
<div class="col-6 mb-2"><div class="stat green">Done<br>{{ completed_count }}</div></div>
<div class="col-6 mb-2"><div class="stat red">Today<br>{{ today_count }}</div></div>

</div>

</div>

</body>
</html>
